<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Project</title>
    <style>
        :root { --ink: #111; --muted: #666; --line: #ddd; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f4f1; color: var(--ink); font: 15px/1.5 Arial, sans-serif; }
        .card { width: min(650px, 100%); padding: clamp(28px, 7vw, 70px); background: #fff; border: 1px solid var(--line); box-shadow: 12px 12px 0 var(--ink); }
        .mark { width: 34px; height: 34px; margin-bottom: 34px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
        .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0 0 16px; font: 700 clamp(2.3rem, 7vw, 4.5rem)/.9 Georgia, serif; letter-spacing: -.06em; }
        p { max-width: 470px; color: var(--muted); }
        .project-link { display: inline-block; margin-top: 18px; padding: 12px 18px; color: #fff; background: var(--ink); font-weight: 700; text-decoration: none; }
        .project-link:hover, .project-link:focus-visible { background: #333; }
        .placeholder { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <main class="card"><div class="mark" aria-hidden="true"></div><p class="eyebrow">Deployment access</p><h1>Live project</h1><p>This page is ready to connect to the Vercel deployment for the project. Replace the placeholder link below when the project URL is available.</p><a class="project-link" href="#vercel-url">Open Vercel project -&gt;</a><p class="placeholder" id="vercel-url">Vercel URL pending. Update the <strong>href</strong> on the button with the link you provide.</p></main>
    <script src="security.js"></script>
</body>
</html>
