<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Access</title>
    <style>
        :root { --ink: #151515; --muted: #707070; --paper: #fff; --line: #d9d9d9; --accent: #a52d2d; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #ece9e4; color: var(--ink); font: 15px/1.5 Arial, sans-serif; }
        .login-shell { width: min(920px, 100%); display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); box-shadow: 14px 14px 0 var(--ink); }
        .intro { display: flex; flex-direction: column; justify-content: space-between; min-height: 570px; padding: clamp(28px, 6vw, 64px); color: #fff; background: var(--ink); }
        .mark { width: 42px; height: 42px; border: 2px solid #fff; display: grid; place-items: center; font: 700 18px Georgia, serif; }
        .intro h1 { margin: 50px 0 16px; font: 700 clamp(2.5rem, 6vw, 4.8rem)/.9 Georgia, serif; letter-spacing: -.06em; }
        .intro p { max-width: 280px; margin: 0; color: #c5c5c5; }
        .classification { color: #e8b18b; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        .form-panel { padding: clamp(28px, 6vw, 64px); align-self: center; }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        h2 { margin: 0 0 30px; font: 700 2rem/1 Georgia, serif; }
        label { display: block; margin: 18px 0 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        input { width: 100%; padding: 13px 12px; color: var(--ink); background: #fafafa; border: 1px solid var(--line); font: inherit; }
        input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        button { width: 100%; margin-top: 28px; padding: 14px; color: #fff; background: var(--ink); border: 0; font: 700 13px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
        button:hover, button:focus-visible { background: var(--accent); }
        .message { min-height: 22px; margin: 16px 0 0; color: var(--accent); font-size: 13px; }
        .fine-print { margin: 28px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
        dialog { width: min(390px, calc(100% - 32px)); padding: 0; color: var(--ink); border: 0; box-shadow: 10px 10px 0 var(--ink); }
        dialog::backdrop { background: rgba(21, 21, 21, .65); }
        .otp-panel { padding: 28px; background: #fff; }
        .otp-panel h3 { margin: 0 0 8px; font: 700 1.6rem Georgia, serif; }
        .otp-panel p { margin: 0; color: var(--muted); font-size: 13px; }
        .otp-panel input { margin-top: 20px; text-align: center; font-size: 1.5rem; letter-spacing: .4em; }
        .otp-panel button { margin-top: 16px; }
        @media (max-width: 680px) { body { padding: 8px; } .login-shell { display: block; box-shadow: 7px 7px 0 var(--ink); } .intro { min-height: 270px; } .intro h1 { margin: 34px 0 10px; } }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="intro"><div class="mark" aria-hidden="true">D</div><div><div class="classification">Private archive</div><h1>Secure<br>access.</h1><p>Enter your credentials to open the document library and project records.</p></div><div class="classification">Local verification required</div></section>
        <section class="form-panel">
            <p class="eyebrow">Document library</p>
            <h2>Sign in</h2>
            <form id="login-form" novalidate>
                <label for="user-id">ID</label>
                <input id="user-id" name="user-id" type="text" autocomplete="username" required autofocus>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Continue</button>
                <p class="message" id="login-message" role="alert" aria-live="polite"></p>
            </form>
            <p class="fine-print">Two-step verification is enabled for this local document archive.</p>
        </section>
    </main>
    <dialog id="otp-dialog" aria-labelledby="otp-title">
        <form class="otp-panel" id="otp-form" method="dialog">
            <h3 id="otp-title">Enter OTP</h3>
            <p>A four-digit verification code is required to continue.</p>
            <label for="otp">One-time password</label>
            <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required>
            <button type="submit">Verify code</button>
            <p class="message" id="otp-message" role="alert" aria-live="polite"></p>
        </form>
    </dialog>
    <script src="security.js"></script>
    <script>
        (function () {
            'use strict';
            var loginForm = document.getElementById('login-form');
            var otpForm = document.getElementById('otp-form');
            var otpDialog = document.getElementById('otp-dialog');
            var loginMessage = document.getElementById('login-message');
            var otpMessage = document.getElementById('otp-message');
            var allowedOtps = ['8353', '1294', '2938', '6210'];

            loginForm.addEventListener('submit', function (event) {
                event.preventDefault();
                if (document.getElementById('user-id').value === 'arronstone' && document.getElementById('password').value === '965425') {
                    loginMessage.textContent = '';
                    otpMessage.textContent = '';
                    otpDialog.showModal();
                    document.getElementById('otp').focus();
                } else {
                    loginMessage.textContent = 'Invalid ID or password.';
                }
            });

            otpForm.addEventListener('submit', function (event) {
                event.preventDefault();
                var code = document.getElementById('otp').value;
                if (allowedOtps.indexOf(code) !== -1) {
                    sessionStorage.setItem('document-authenticated', 'true');
                    window.location.replace('index.html');
                } else {
                    otpMessage.textContent = 'Invalid OTP. Enter a valid four-digit code.';
                    document.getElementById('otp').select();
                }
            });
        }());
    </script>
</body>
</html>
